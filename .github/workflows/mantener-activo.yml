name: Mantener activo

# GitHub apaga las tareas programadas de un proyecto sin cambios en 60 días.
# Esto hace un cambio mínimo cada mes para que el vigilante nunca se apague.
on:
  schedule:
    - cron: "0 12 1 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  latido:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          date -u > .latido
          git config user.name "vigilante-bot"
          git config user.email "vigilante-bot@users.noreply.github.com"
          git add .latido
          git commit -m "Latido mensual" || exit 0
          git push
